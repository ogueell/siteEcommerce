<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Loja Virtual</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="container cabecalho-conteudo">
        <h1 class="logo">Loja Virtual</h1>
        <a class="botao-pedidos" href="pedidos.html">Meus pedidos</a>
        <a href="index.html" class="botao-voltar-link">Voltar ao catálogo</a>
      </div>
    </header>

    <main class="conteudo-principal checkout-page">
      <div class="container checkout-layout">
        <section class="checkout-formulario" aria-labelledby="titulo-checkout">
          <h2 id="titulo-checkout">Finalizar pedido</h2>

          <form id="form-checkout" noValidate>
            <fieldset class="grupo-checkout">
              <legend>Dados pessoais</legend>

              <div class="campo-duplo">
                <div class="campo">
                  <label for="nome">Nome completo</label>
                  <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required minlength="3" maxlength="80" />
                  <small class="mensagem-erro" aria-live="polite"></small>
                </div>

                <div class="campo">
                  <label for="email">E-mail</label>
                  <input type="email" id="email" name="email" placeholder="seuemail@email.com" required maxlength="120" pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" />
                  <small class="mensagem-erro" aria-live="polite"></small>
                </div>
              </div>

              <div class="campo-duplo">
                <div class="campo">
                  <label for="cpf">CPF</label>
                  <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required minlength="14" maxlength="14" pattern="^\d{3}\.\d{3}\.\d{3}-\d{2}$" />
                  <small class="mensagem-erro" aria-live="polite"></small>
                </div>

                <div class="campo">
                  <label for="telefone">Telefone</label>
                  <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required minlength="14" maxlength="15" pattern="^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$" />
                  <small class="mensagem-erro" aria-live="polite"></small>
                </div>
              </div>
            </fieldset>

            <fieldset class="grupo-checkout">
              <legend>Endereço</legend>

              <div class="campo-duplo">
                <div class="campo">
                  <label for="cep">CEP</label>
                  <input type="text" id="cep" name="cep" placeholder="00000-000" required minlength="9" maxlength="9" pattern="^\d{5}-\d{3}$" />
                  <small class="mensagem-erro" aria-live="polite"></small>
                </div>

                <div class="campo">
                  <label for="cidade">Cidade</label>
                  <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required minlength="2" maxlength="80" />
                  <small class="mensagem-erro" aria-live="polite"></small>
                </div>
              </div>

              <div class="campo-duplo">
                <div class="campo">
                  <label for="rua">Rua</label>
                  <input type="text" id="rua" name="rua" placeholder="Nome da rua" required minlength="3" maxlength="100" />
                  <small class="mensagem-erro" aria-live="polite"></small>
                </div>

                <div class="campo">
                  <label for="numero">Número</label>
                  <input type="text" id="numero" name="numero" placeholder="123" required minlength="1" maxlength="10" pattern="^[0-9A-Za-z]+$" />
                  <small class="mensagem-erro" aria-live="polite"></small>
                </div>
              </div>

              <div class="campo">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required>
                  <option value="">Selecione o estado</option>
                  <option value="SP">SP</option>
                  <option value="RJ">RJ</option>
                  <option value="MG">MG</option>
                  <option value="PR">PR</option>
                  <option value="SC">SC</option>
                  <option value="RS">RS</option>
                  <option value="BA">BA</option>
                  <option value="PE">PE</option>
                  <option value="CE">CE</option>
                  <option value="GO">GO</option>
                  <option value="DF">DF</option>
                  <option value="Outro">Outro</option>
                </select>
                <small class="mensagem-erro" aria-live="polite"></small>
              </div>

              <div class="campo">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" name="complemento" placeholder="Apartamento, bloco, etc." maxlength="100" />
                <small class="mensagem-erro" aria-live="polite"></small>
              </div>
            </fieldset>

            <fieldset class="grupo-checkout">
              <legend>Pagamento</legend>

              <div class="pagamento-opcoes" role="radiogroup" aria-label="Forma de pagamento">
                <label class="opcao-pagamento">
                  <input type="radio" name="pagamento" value="Cartão de crédito" required />
                  <span>Cartão de crédito</span>
                </label>
                <label class="opcao-pagamento">
                  <input type="radio" name="pagamento" value="Cartão de débito" />
                  <span>Cartão de débito</span>
                </label>
                <label class="opcao-pagamento">
                  <input type="radio" name="pagamento" value="Pix" />
                  <span>Pix</span>
                </label>
                <label class="opcao-pagamento">
                  <input type="radio" name="pagamento" value="Boleto" />
                  <span>Boleto</span>
                </label>
              </div>
              <small class="mensagem-erro mensagem-erro-pagamento" aria-live="polite"></small>
            </fieldset>

            <button type="submit" class="botao-finalizar-checkout">Finalizar pedido</button>
          </form>
        </section>

        <aside class="checkout-resumo" aria-labelledby="titulo-resumo">
          <h2 id="titulo-resumo">Resumo do pedido</h2>

          <div id="lista-resumo-produtos" class="lista-resumo-produtos"></div>

          <div class="resumo-totais">
            <div>
              <span>Subtotal</span>
              <strong id="subtotal-checkout">R$ 0,00</strong>
            </div>
            <div>
              <span>Frete</span>
              <strong id="frete-checkout">R$ 0,00</strong>
            </div>
            <div>
              <span>Desconto</span>
              <strong id="desconto-checkout">- R$ 0,00</strong>
            </div>
            <div class="total-final">
              <span>Total final</span>
              <strong id="total-checkout">R$ 0,00</strong>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <script src="js/produtos.js"></script>
    <script src="js/checkout.js"></script>
  </body>
</html>
